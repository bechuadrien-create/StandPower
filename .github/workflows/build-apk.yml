name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout du code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔍 Vérifier versions Node/npm
        run: |
          node --version
          npm --version

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📥 Installer les dépendances npm
        run: npm ci

      - name: 🔍 Linter TypeScript
        run: npm run lint

      - name: 🔨 Build du frontend (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: 🔄 Synchroniser Capacitor avec Android
        run: npx cap sync android

      - name: 🔍 Vérifier structure Android après Capacitor
        run: |
          echo "=== Chercher gradlew ==="
          if [ -f android/gradlew ]; then
            echo "✅ gradlew trouvé"
            ls -lh android/gradlew
          else
            echo "❌ gradlew MANQUANT - Tentative d'init..."
            cd android
            gradle wrapper --gradle-version 8.9
            cd ..
          fi

      - name: 🔐 Rendre gradlew exécutable
        if: hashFiles('android/gradlew') != ''
        run: chmod +x android/gradlew

      - name: 🏗️ Build de l'APK Debug
        if: hashFiles('android/gradlew') != ''
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload APK comme artifact
        if: success() && hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: standpower-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: ❌ Déboguer en cas d'erreur
        if: failure()
        run: |
          echo "=== Contenu de android/ ==="
          ls -la android/ || echo "Dossier android/ n'existe pas"
          echo "=== Chercher tous les gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null || echo "Aucun gradlew trouvé"
          echo "=== Vérifier si la compilation a généré des artefacts ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "Aucun APK généré"