name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ✅ Checkout du code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📥 Installer les dépendances npm
        run: npm ci

      - name: 🔨 Build du frontend (Vite)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          GEMINI_API_KEY: demo_key_testing_only

      - name: 🔄 Installer Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔄 Synchroniser Capacitor avec Android
        run: npx cap sync android

      - name: 📂 Vérifier structure Android
        run: |
          echo "📂 Structure du dossier android :"
          ls -la android/ || echo "❌ Dossier android manquant!"
          if [ -d "android" ]; then
            echo "✅ Dossier android trouvé"
            ls -la android/app/
          fi

      - name: ✅ Rendre gradlew exécutable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            echo "✅ gradlew rendu exécutable"
          else
            echo "⚠️ gradlew manquant! Création..."
            cd android && gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            echo "✅ gradle wrapper créé"
          fi

      - name: 🏗️ Build de l'APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        timeout-minutes: 30

      - name: 📤 Upload APK sur GitHub
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: standpower-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: ❌ Afficher les erreurs de build
        if: failure()
        run: |
          echo "=== ERREURS DE BUILD ==="
          if [ -f android/app/build/outputs/errors.txt ]; then
            cat android/app/build/outputs/errors.txt
          fi
          echo "=== FIN DES ERREURS ==="
