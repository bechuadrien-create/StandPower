name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ✅ Checkout du code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Installer les dépendances npm
        run: npm ci

      - name: 🔨 Build du frontend (Vite)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          GEMINI_API_KEY: demo_key_testing_only

      - name: 🔄 Synchroniser Capacitor avec Android
        run: npx cap sync android

      - name: 🐘 Setup Gradle 8.13 officiel
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 🔧 Régénération forcée du wrapper Gradle
        run: |
          echo "⚙️ Suppression de l'ancien wrapper (potentiellement corrompu)..."
          rm -f android/gradlew android/gradlew.bat
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          echo "⚙️ Régénération propre du wrapper Gradle 8.13 via la commande officielle..."
          cd android
          gradle wrapper --gradle-version 8.13 --distribution-type all
          cd ..
          echo "✅ Wrapper régénéré :"
          ls -la android/gradlew android/gradle/wrapper/

      - name: ✅ Configurer les permissions d'exécution de gradlew
        run: |
          chmod +x android/gradlew
          echo "✅ gradlew rendu exécutable"

      - name: 🏗️ Build de l'APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        timeout-minutes: 30

      - name: 📤 Upload APK sur GitHub
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: standpower-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: ❌ Afficher les erreurs de build
        if: failure()
        run: |
          echo "=== ERREURS DE BUILD ==="
          if [ -f android/app/build/outputs/errors.txt ]; then
            cat android/app/build/outputs/errors.txt
          fi
          echo "=== FIN DES ERREURS ==="
