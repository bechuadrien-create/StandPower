<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090117"/>
      <stop offset="45%" stop-color="#210842"/>
      <stop offset="85%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Emerald Energy Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- Purple/Violet Impact Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="30%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Manga Speed / Impact Burst Lines -->
  <g opacity="0.35" fill="#A78BFA">
    <polygon points="512,512 0,60 0,140"/>
    <polygon points="512,512 0,380 0,460"/>
    <polygon points="512,512 0,820 0,900"/>
    <polygon points="512,512 120,1024 200,1024"/>
    <polygon points="512,512 560,1024 640,1024"/>
    <polygon points="512,512 900,1024 980,1024"/>
    <polygon points="512,512 1024,780 1024,860"/>
    <polygon points="512,512 1024,320 1024,400"/>
    <polygon points="512,512 1024,40 1024,120"/>
    <polygon points="512,512 780,0 860,0"/>
    <polygon points="512,512 420,0 500,0"/>
    <polygon points="512,512 140,0 220,0"/>
  </g>

  <!-- Dynamic Manga Lightning & Energy Shards (JoJo Menacing Aura) -->
  <g filter="url(#glow)">
    <!-- Emerald Energy Shards -->
    <polygon points="180,240 260,160 290,290 220,330" fill="url(#emeraldGrad)" opacity="0.85"/>
    <polygon points="760,180 880,140 820,260 740,220" fill="url(#emeraldGrad)" opacity="0.9"/>
    <polygon points="820,720 920,800 800,850 750,770" fill="url(#emeraldGrad)" opacity="0.85"/>
    <polygon points="140,760 220,860 160,900 100,810" fill="url(#emeraldGrad)" opacity="0.8"/>
    <polygon points="460,80 540,40 500,140 440,110" fill="url(#emeraldGrad)" opacity="0.75"/>
    <!-- Menacing SFX angular glyphs / Katakana stylized "ゴ" & impact triangles -->
    <polygon points="210,480 270,440 250,530 190,520" fill="#10B981" opacity="0.7"/>
    <polygon points="780,480 850,420 830,510 770,520" fill="#10B981" opacity="0.7"/>
  </g>

  <!-- Big Central Impact Polygon (Inked Backing) -->
  <polygon points="512,120 740,260 880,512 740,780 512,920 284,780 144,512 284,260"
           fill="#0B031A" stroke="#10B981" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="4"/>
  
  <polygon points="512,150 710,280 830,512 710,750 512,880 314,750 194,512 314,280"
           fill="#1C093B" stroke="#8B5CF6" stroke-width="8" opacity="0.9"/>

  <!-- Dramatic Shadow Behind "SP" Letters -->
  <g transform="translate(24, 32)">
    <!-- 'S' Shadow -->
    <path d="M 450,300 L 300,300 L 260,460 L 410,480 L 390,620 L 230,620 L 210,720 L 450,720 L 490,540 L 340,520 L 360,400 L 470,400 Z"
          fill="#000000" opacity="0.85"/>
    <!-- 'P' Shadow -->
    <path d="M 520,300 L 740,300 L 790,490 L 680,580 L 630,580 L 600,720 L 490,720 L 580,300 Z M 620,390 L 590,500 L 670,500 L 700,450 L 690,390 Z"
          fill="#000000" opacity="0.85"/>
  </g>

  <!-- Inked Manga Border for 'S' & 'P' -->
  <g>
    <!-- Heavy Manga Black Stroke for 'S' -->
    <path d="M 440,280 L 280,280 L 240,460 L 390,480 L 370,620 L 210,620 L 190,720 L 440,720 L 480,530 L 330,510 L 350,380 L 460,380 Z"
          fill="#05010D" stroke="#05010D" stroke-width="26" stroke-linejoin="bevel"/>
    
    <!-- Heavy Manga Black Stroke for 'P' -->
    <path d="M 510,280 L 740,280 L 790,480 L 680,570 L 630,570 L 600,720 L 480,720 L 570,280 Z"
          fill="#05010D" stroke="#05010D" stroke-width="26" stroke-linejoin="bevel"/>
  </g>

  <!-- Letter 'S' - Dynamic Manga Styled -->
  <path d="M 440,280 L 280,280 L 240,460 L 390,480 L 370,620 L 210,620 L 190,720 L 440,720 L 480,530 L 330,510 L 350,380 L 460,380 Z"
        fill="url(#violetGrad)"/>
  
  <!-- 'S' Inner Emerald Energy Slash / Facet -->
  <path d="M 430,300 L 300,300 L 270,440 L 390,460 L 370,500 L 260,480 L 280,340 L 420,340 Z"
        fill="url(#emeraldGrad)" opacity="0.9"/>
  <path d="M 420,550 L 350,540 L 335,640 L 215,640 L 205,700 L 425,700 L 460,550 Z"
        fill="url(#emeraldGrad)" opacity="0.9"/>

  <!-- Letter 'P' - Dynamic Manga Styled -->
  <path d="M 510,280 L 740,280 L 790,480 L 680,570 L 630,570 L 600,720 L 480,720 L 570,280 Z"
        fill="url(#violetGrad)"/>
  
  <!-- 'P' Counter (Hole) Cutout with Emerald Aura -->
  <polygon points="615,360 580,500 665,500 705,450 695,360"
           fill="#130528" stroke="#05010D" stroke-width="12"/>
  <polygon points="615,360 580,500 665,500 705,450 695,360"
           fill="url(#emeraldGrad)" opacity="0.4"/>

  <!-- 'P' Sharp Highlight Facet -->
  <polygon points="525,300 725,300 765,465 675,545 640,545 615,695 510,695 580,370 535,370"
           fill="url(#emeraldGrad)" opacity="0.85"/>
  <polygon points="540,320 700,320 735,450 665,520 635,520 605,670 535,670 590,400 550,400"
           fill="#FFFFFF" opacity="0.65"/>

  <!-- Cross-Slash Manga Power Bolts (Front Lightning) -->
  <polygon points="460,180 500,280 470,290 530,420 490,430 560,560 510,560 610,760 570,760 630,860 590,870 530,750 565,745 490,570 525,565 445,430 480,425 430,290 460,285"
           fill="#10B981" filter="url(#glow)"/>
  <polygon points="460,180 500,280 470,290 530,420 490,430 560,560 510,560 610,760 570,760 630,860 590,870 530,750 565,745 490,570 525,565 445,430 480,425 430,290 460,285"
           fill="#A7F3D0" opacity="0.9"/>

  <!-- Sparkles / JoJo Star Gleam -->
  <path d="M 740,240 Q 770,240 770,210 Q 770,240 800,240 Q 770,240 770,270 Q 770,240 740,240 Z" fill="#FDE047" filter="url(#glow)"/>
  <path d="M 260,700 Q 285,700 285,675 Q 285,700 310,700 Q 285,700 285,725 Q 285,700 260,700 Z" fill="#34D399" filter="url(#glow)"/>
</svg>
